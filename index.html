<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片水印工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0f14;
      --bg-secondary: #111820;
      --fg: #e8edf3;
      --muted: #6b7a8f;
      --accent: #00d4aa;
      --accent-dim: rgba(0, 212, 170, 0.15);
      --card: #151d27;
      --border: #1e2a38;
      --danger: #ff5c5c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Background grid pattern */
    .bg-grid {
      background-image: 
        linear-gradient(rgba(0, 212, 170, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 170, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    /* Glow orbs */
    .glow-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
    }

    .glow-orb-1 {
      width: 400px;
      height: 400px;
      background: rgba(0, 212, 170, 0.12);
      top: -100px;
      right: -100px;
    }

    .glow-orb-2 {
      width: 300px;
      height: 300px;
      background: rgba(0, 180, 216, 0.1);
      bottom: -50px;
      left: -50px;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed var(--border);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .upload-zone::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 40%, var(--accent-dim) 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .upload-zone:hover,
    .upload-zone.drag-over {
      border-color: var(--accent);
      background: var(--card);
    }

    .upload-zone:hover::before,
    .upload-zone.drag-over::before {
      opacity: 1;
    }

    /* Buttons */
    .btn-primary {
      background: var(--accent);
      color: var(--bg);
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-primary::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 212, 170, 0.3);
    }

    .btn-primary:hover::after {
      opacity: 1;
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--card);
      color: var(--fg);
      font-weight: 500;
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: var(--bg-secondary);
      border-color: var(--accent);
    }

    /* Input fields */
    .input-field {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 10px 14px;
      border-radius: 6px;
      width: 100%;
      transition: all 0.2s ease;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    /* Range slider */
    .range-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      outline: none;
    }

    .range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .range-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      box-shadow: 0 0 12px rgba(0, 212, 170, 0.5);
    }

    /* Position grid */
    .position-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      width: 100%;
      max-width: 120px;
    }

    .position-btn {
      aspect-ratio: 1;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .position-btn:hover {
      background: var(--card);
      border-color: var(--accent);
    }

    .position-btn.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    .position-btn.active .dot {
      background: var(--bg);
    }

    .dot {
      width: 6px;
      height: 6px;
      background: var(--muted);
      border-radius: 50%;
      transition: background 0.15s ease;
    }

    /* Canvas container */
    .canvas-container {
      background: var(--bg-secondary);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .canvas-container canvas {
      max-width: 100%;
      max-height: 500px;
      object-fit: contain;
    }

    /* Tab buttons */
    .tab-btn {
      padding: 10px 20px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-weight: 500;
      cursor: pointer;
      position: relative;
      transition: color 0.2s ease;
    }

    .tab-btn::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--accent);
      transform: scaleX(0);
      transition: transform 0.2s ease;
    }

    .tab-btn:hover {
      color: var(--fg);
    }

    .tab-btn.active {
      color: var(--accent);
    }

    .tab-btn.active::after {
      transform: scaleX(1);
    }

    /* Section label */
    .section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    /* Fade in animation */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-in {
      animation: fadeInUp 0.5s ease forwards;
    }

    .delay-1 { animation-delay: 0.1s; opacity: 0; }
    .delay-2 { animation-delay: 0.2s; opacity: 0; }
    .delay-3 { animation-delay: 0.3s; opacity: 0; }

    /* Watermark preview animation */
    @keyframes watermarkPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 0.9; }
    }

    /* Color picker wrapper */
    .color-picker-wrapper {
      position: relative;
      width: 40px;
      height: 40px;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid var(--border);
    }

    .color-picker-wrapper input[type="color"] {
      position: absolute;
      inset: -8px;
      width: calc(100% + 16px);
      height: calc(100% + 16px);
      cursor: pointer;
      border: none;
    }

    /* Preview placeholder */
    .preview-placeholder {
      color: var(--muted);
      text-align: center;
      padding: 60px 20px;
    }

    .preview-placeholder svg {
      margin-bottom: 16px;
      opacity: 0.5;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="bg-grid">
  <!-- Glow orbs -->
  <div class="glow-orb glow-orb-1"></div>
  <div class="glow-orb glow-orb-2"></div>

  <div class="relative z-10 min-h-screen p-4 md:p-8">
    <!-- Header -->
    <header class="max-w-7xl mx-auto mb-8 animate-in">
      <div class="flex items-center gap-3 mb-2">
        <div class="w-10 h-10 rounded-lg flex items-center justify-center" style="background: var(--accent-dim);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M12 8v4"/>
            <path d="M10 10h4"/>
          </svg>
        </div>
        <h1 class="text-2xl md:text-3xl font-bold tracking-tight">Watermark Studio</h1>
      </div>
      <p class="text-sm md:text-base" style="color: var(--muted);">快速为图片添加自定义水印，支持文字与图片水印</p>
    </header>

    <!-- Main content -->
    <main class="max-w-7xl mx-auto">
      <div class="main-grid grid lg:grid-cols-[380px_1fr] gap-6">
        <!-- Control Panel -->
        <aside class="animate-in delay-1">
          <div class="rounded-xl p-5" style="background: var(--card); border: 1px solid var(--border);">
            <!-- Upload -->
            <div class="mb-6">
              <p class="section-label">上传图片</p>
              <label class="upload-zone block rounded-lg p-6 cursor-pointer text-center" id="uploadZone">
                <input type="file" accept="image/*" class="hidden" id="imageInput">
                <svg class="mx-auto mb-3" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color: var(--muted);">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="17 8 12 3 7 8"/>
                  <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <p class="text-sm" style="color: var(--muted);">点击或拖拽图片到此处</p>
              </label>
            </div>

            <!-- Watermark Type Tabs -->
            <div class="mb-6">
              <p class="section-label">水印类型</p>
              <div class="flex border-b" style="border-color: var(--border);">
                <button class="tab-btn active" data-type="text">文字水印</button>
                <button class="tab-btn" data-type="image">图片水印</button>
              </div>
            </div>

            <!-- Text Watermark Settings -->
            <div id="textSettings" class="space-y-5">
              <div>
                <p class="section-label">水印文字</p>
                <input type="text" id="watermarkText" class="input-field mono" placeholder="输入水印文字..." value="WATERMARK">
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <p class="section-label">字体大小</p>
                  <div class="flex items-center gap-3">
                    <input type="range" id="fontSize" class="range-slider flex-1" min="12" max="120" value="32">
                    <span class="mono text-sm w-10 text-right" id="fontSizeValue">32</span>
                  </div>
                </div>
                <div>
                  <p class="section-label">透明度</p>
                  <div class="flex items-center gap-3">
                    <input type="range" id="opacity" class="range-slider flex-1" min="10" max="100" value="60">
                    <span class="mono text-sm w-10 text-right" id="opacityValue">60%</span>
                  </div>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <p class="section-label">文字颜色</p>
                  <div class="flex items-center gap-3">
                    <div class="color-picker-wrapper">
                      <input type="color" id="textColor" value="#ffffff">
                    </div>
                    <span class="mono text-sm" id="textColorValue">#ffffff</span>
                  </div>
                </div>
                <div>
                  <p class="section-label">旋转角度</p>
                  <div class="flex items-center gap-3">
                    <input type="range" id="rotation" class="range-slider flex-1" min="-180" max="180" value="-30">
                    <span class="mono text-sm w-10 text-right" id="rotationValue">-30°</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Image Watermark Settings -->
            <div id="imageSettings" class="space-y-5 hidden">
              <div>
                <p class="section-label">水印图片</p>
                <label class="upload-zone block rounded-lg p-4 cursor-pointer text-center">
                  <input type="file" accept="image/*" class="hidden" id="watermarkImageInput">
                  <div id="watermarkImagePreview">
                    <svg class="mx-auto mb-2" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color: var(--muted);">
                      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                      <circle cx="8.5" cy="8.5" r="1.5"/>
                      <polyline points="21 15 16 10 5 21"/>
                    </svg>
                    <p class="text-xs" style="color: var(--muted);">选择水印图片</p>
                  </div>
                </label>
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <p class="section-label">缩放比例</p>
                  <div class="flex items-center gap-3">
                    <input type="range" id="scale" class="range-slider flex-1" min="10" max="100" value="30">
                    <span class="mono text-sm w-10 text-right" id="scaleValue">30%</span>
                  </div>
                </div>
                <div>
                  <p class="section-label">透明度</p>
                  <div class="flex items-center gap-3">
                    <input type="range" id="imgOpacity" class="range-slider flex-1" min="10" max="100" value="70">
                    <span class="mono text-sm w-10 text-right" id="imgOpacityValue">70%</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Position -->
            <div class="mt-6">
              <p class="section-label">水印位置</p>
              <div class="flex items-start gap-6">
                <div class="position-grid" id="positionGrid">
                  <button class="position-btn" data-position="top-left"><span class="dot"></span></button>
                  <button class="position-btn" data-position="top-center"><span class="dot"></span></button>
                  <button class="position-btn" data-position="top-right"><span class="dot"></span></button>
                  <button class="position-btn" data-position="middle-left"><span class="dot"></span></button>
                  <button class="position-btn active" data-position="center"><span class="dot"></span></button>
                  <button class="position-btn" data-position="middle-right"><span class="dot"></span></button>
                  <button class="position-btn" data-position="bottom-left"><span class="dot"></span></button>
                  <button class="position-btn" data-position="bottom-center"><span class="dot"></span></button>
                  <button class="position-btn" data-position="bottom-right"><span class="dot"></span></button>
                </div>
                <div class="flex-1">
                  <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="tileMode" class="w-4 h-4 accent-current" style="accent-color: var(--accent);">
                    <span class="text-sm">平铺水印</span>
                  </label>
                </div>
              </div>
            </div>

            <!-- Actions -->
            <div class="mt-8 flex gap-3">
              <button class="btn-primary flex-1" id="downloadBtn" disabled>
                <span class="flex items-center justify-center gap-2">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                  </svg>
                  下载图片
                </span>
              </button>
              <button class="btn-secondary" id="resetBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                  <path d="M3 3v5h5"/>
                </svg>
              </button>
            </div>
          </div>
        </aside>

        <!-- Preview -->
        <section class="animate-in delay-2">
          <div class="rounded-xl overflow-hidden" style="background: var(--card); border: 1px solid var(--border);">
            <div class="px-5 py-3 flex items-center justify-between" style="border-bottom: 1px solid var(--border);">
              <span class="text-sm font-medium">预览</span>
              <div class="flex items-center gap-3">
                <span class="mono text-xs" style="color: var(--muted);" id="imageInfo">等待上传...</span>
              </div>
            </div>
            <div class="canvas-container p-4" id="canvasContainer">
              <div class="preview-placeholder" id="placeholder">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/>
                  <polyline points="21 15 16 10 5 21"/>
                </svg>
                <p>上传图片开始添加水印</p>
              </div>
              <canvas id="canvas" class="hidden rounded-lg"></canvas>
            </div>
          </div>

          <!-- Tips -->
          <div class="mt-4 p-4 rounded-lg" style="background: var(--accent-dim); border: 1px solid rgba(0, 212, 170, 0.2);">
            <div class="flex gap-3">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" class="flex-shrink-0 mt-0.5">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="16" x2="12" y2="12"/>
                <line x1="12" y1="8" x2="12.01" y2="8"/>
              </svg>
              <div class="text-sm" style="color: var(--fg);">
                <p class="font-medium mb-1">使用提示</p>
                <p style="color: var(--muted);">支持 PNG、JPG、WebP 格式。平铺模式适合全图水印保护，单点模式适合角落署名。</p>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script>
    // State
    let state = {
      image: null,
      watermarkImage: null,
      type: 'text',
      position: 'center',
      text: 'WATERMARK',
      fontSize: 32,
      opacity: 60,
      textColor: '#ffffff',
      rotation: -30,
      scale: 30,
      imgOpacity: 70,
      tileMode: false
    };

    // DOM Elements
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const imageInput = document.getElementById('imageInput');
    const watermarkImageInput = document.getElementById('watermarkImageInput');
    const uploadZone = document.getElementById('uploadZone');
    const placeholder = document.getElementById('placeholder');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');
    const imageInfo = document.getElementById('imageInfo');

    // Tab buttons
    const tabBtns = document.querySelectorAll('.tab-btn');
    const textSettings = document.getElementById('textSettings');
    const imageSettings = document.getElementById('imageSettings');

    // Position buttons
    const positionBtns = document.querySelectorAll('.position-btn');

    // Input elements
    const watermarkText = document.getElementById('watermarkText');
    const fontSize = document.getElementById('fontSize');
    const opacity = document.getElementById('opacity');
    const textColor = document.getElementById('textColor');
    const rotation = document.getElementById('rotation');
    const scale = document.getElementById('scale');
    const imgOpacity = document.getElementById('imgOpacity');
    const tileMode = document.getElementById('tileMode');

    // Value displays
    const fontSizeValue = document.getElementById('fontSizeValue');
    const opacityValue = document.getElementById('opacityValue');
    const textColorValue = document.getElementById('textColorValue');
    const rotationValue = document.getElementById('rotationValue');
    const scaleValue = document.getElementById('scaleValue');
    const imgOpacityValue = document.getElementById('imgOpacityValue');

    // Tab switching
    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.type = btn.dataset.type;
        
        if (state.type === 'text') {
          textSettings.classList.remove('hidden');
          imageSettings.classList.add('hidden');
        } else {
          textSettings.classList.add('hidden');
          imageSettings.classList.remove('hidden');
        }
        
        render();
      });
    });

    // Position selection
    positionBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        positionBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.position = btn.dataset.position;
        render();
      });
    });

    // Drag and drop
    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('drag-over');
    });

    uploadZone.addEventListener('dragleave', () => {
      uploadZone.classList.remove('drag-over');
    });

    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        loadImage(file);
      }
    });

    // File input handlers
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) loadImage(file);
    });

    watermarkImageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) loadWatermarkImage(file);
    });

    // Load main image
    function loadImage(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          state.image = img;
          placeholder.classList.add('hidden');
          canvas.classList.remove('hidden');
          downloadBtn.disabled = false;
          imageInfo.textContent = `${img.width} × ${img.height}px`;
          render();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Load watermark image
    function loadWatermarkImage(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          state.watermarkImage = img;
          const preview = document.getElementById('watermarkImagePreview');
          preview.innerHTML = `<img src="${e.target.result}" class="max-h-16 mx-auto rounded">`;
          render();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Input event listeners
    watermarkText.addEventListener('input', (e) => {
      state.text = e.target.value || 'WATERMARK';
      render();
    });

    fontSize.addEventListener('input', (e) => {
      state.fontSize = parseInt(e.target.value);
      fontSizeValue.textContent = state.fontSize;
      render();
    });

    opacity.addEventListener('input', (e) => {
      state.opacity = parseInt(e.target.value);
      opacityValue.textContent = state.opacity + '%';
      render();
    });

    textColor.addEventListener('input', (e) => {
      state.textColor = e.target.value;
      textColorValue.textContent = e.target.value;
      render();
    });

    rotation.addEventListener('input', (e) => {
      state.rotation = parseInt(e.target.value);
      rotationValue.textContent = state.rotation + '°';
      render();
    });

    scale.addEventListener('input', (e) => {
      state.scale = parseInt(e.target.value);
      scaleValue.textContent = state.scale + '%';
      render();
    });

    imgOpacity.addEventListener('input', (e) => {
      state.imgOpacity = parseInt(e.target.value);
      imgOpacityValue.textContent = state.imgOpacity + '%';
      render();
    });

    tileMode.addEventListener('change', (e) => {
      state.tileMode = e.target.checked;
      render();
    });

    // Reset button
    resetBtn.addEventListener('click', () => {
      state = {
        image: null,
        watermarkImage: null,
        type: 'text',
        position: 'center',
        text: 'WATERMARK',
        fontSize: 32,
        opacity: 60,
        textColor: '#ffffff',
        rotation: -30,
        scale: 30,
        imgOpacity: 70,
        tileMode: false
      };
      
      // Reset UI
      watermarkText.value = 'WATERMARK';
      fontSize.value = 32;
      fontSizeValue.textContent = '32';
      opacity.value = 60;
      opacityValue.textContent = '60%';
      textColor.value = '#ffffff';
      textColorValue.textContent = '#ffffff';
      rotation.value = -30;
      rotationValue.textContent = '-30°';
      scale.value = 30;
      scaleValue.textContent = '30%';
      imgOpacity.value = 70;
      imgOpacityValue.textContent = '70%';
      tileMode.checked = false;
      
      positionBtns.forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.position === 'center') btn.classList.add('active');
      });
      
      placeholder.classList.remove('hidden');
      canvas.classList.add('hidden');
      downloadBtn.disabled = true;
      imageInfo.textContent = '等待上传...';
    });

    // Download button
    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'watermarked-image.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // Render canvas
    function render() {
      if (!state.image) return;

      // Set canvas size
      canvas.width = state.image.width;
      canvas.height = state.image.height;

      // Draw original image
      ctx.drawImage(state.image, 0, 0);

      // Apply watermark
      if (state.type === 'text') {
        drawTextWatermark();
      } else if (state.watermarkImage) {
        drawImageWatermark();
      }
    }

    function drawTextWatermark() {
      ctx.save();
      
      const alpha = state.opacity / 100;
      ctx.font = `bold ${state.fontSize}px "Space Grotesk", sans-serif`;
      ctx.fillStyle = hexToRgba(state.textColor, alpha);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (state.tileMode) {
        drawTiledWatermark();
      } else {
        drawSingleTextWatermark();
      }
      
      ctx.restore();
    }

    function drawSingleTextWatermark() {
      const pos = getPosition();
      ctx.translate(pos.x, pos.y);
      ctx.rotate(state.rotation * Math.PI / 180);
      ctx.fillText(state.text, 0, 0);
    }

    function drawTiledWatermark() {
      const gap = state.fontSize * 3;
      const diagonal = Math.sqrt(canvas.width ** 2 + canvas.height ** 2);
      
      for (let y = -diagonal; y < diagonal; y += gap) {
        for (let x = -diagonal; x < diagonal; x += gap) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(state.rotation * Math.PI / 180);
          ctx.fillText(state.text, 0, 0);
          ctx.restore();
        }
      }
    }

    function drawImageWatermark() {
      if (!state.watermarkImage) return;
      
      ctx.save();
      
      const alpha = state.imgOpacity / 100;
      ctx.globalAlpha = alpha;
      
      const scaleRatio = state.scale / 100;
      const wmWidth = state.watermarkImage.width * scaleRatio;
      const wmHeight = state.watermarkImage.height * scaleRatio;
      
      if (state.tileMode) {
        const gapX = wmWidth * 1.5;
        const gapY = wmHeight * 1.5;
        
        for (let y = 0; y < canvas.height + gapY; y += gapY) {
          for (let x = 0; x < canvas.width + gapX; x += gapX) {
            ctx.drawImage(state.watermarkImage, x - wmWidth / 2, y - wmHeight / 2, wmWidth, wmHeight);
          }
        }
      } else {
        const pos = getPosition(wmWidth, wmHeight);
        ctx.drawImage(state.watermarkImage, pos.x, pos.y, wmWidth, wmHeight);
      }
      
      ctx.restore();
    }

    function getPosition(wmWidth = 0, wmHeight = 0) {
      const padding = 20;
      let x = canvas.width / 2;
      let y = canvas.height / 2;
      
      switch (state.position) {
        case 'top-left':
          x = padding + wmWidth / 2;
          y = padding + wmHeight / 2;
          break;
        case 'top-center':
          y = padding + wmHeight / 2;
          break;
        case 'top-right':
          x = canvas.width - padding - wmWidth / 2;
          y = padding + wmHeight / 2;
          break;
        case 'middle-left':
          x = padding + wmWidth / 2;
          break;
        case 'middle-right':
          x = canvas.width - padding - wmWidth / 2;
          break;
        case 'bottom-left':
          x = padding + wmWidth / 2;
          y = canvas.height - padding - wmHeight / 2;
          break;
        case 'bottom-center':
          y = canvas.height - padding - wmHeight / 2;
          break;
        case 'bottom-right':
          x = canvas.width - padding - wmWidth / 2;
          y = canvas.height - padding - wmHeight / 2;
          break;
      }
      
      return { x, y };
    }

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }
  </script>
</body>
