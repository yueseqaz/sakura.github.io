<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Studio — AI Powered</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>


<style>


/* ================= RESET ================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:#fff;
font-family:'Barlow',sans-serif;
overflow-x:hidden;
}


/* ================= SCROLL BAR ================= */

#scrollBar{

position:fixed;
top:0;
left:0;

height:3px;
width:0%;

z-index:9999;

background:linear-gradient(
90deg,
#fff,
#aaa,
#fff
);

}



/* ================= CURSOR GLOW ================= */

#cursorGlow{

position:fixed;

width:400px;
height:400px;

border-radius:50%;

pointer-events:none;

background:
radial-gradient(
circle,
rgba(255,255,255,0.08),
rgba(255,255,255,0.02),
transparent 70%
);

filter:blur(40px);

transform:translate(-50%,-50%);

z-index:0;

}



/* ================= PARTICLES ================= */

#bgParticles{

position:fixed;

inset:0;

z-index:-1;

}



/* ================= GLASS ================= */

.liquid-glass{

background:rgba(255,255,255,0.03);

backdrop-filter:blur(10px);

border-radius:999px;

border:1px solid rgba(255,255,255,0.1);

}



/* ================= NAV ================= */

.nav{

position:fixed;

top:10px;

left:0;
right:0;

display:flex;
justify-content:center;

z-index:50;

}

.nav-inner{

display:flex;

gap:20px;

padding:8px 20px;

}



.nav a{

color:#fff;

font-size:14px;

padding:6px 12px;

border-radius:999px;

}



.nav a:hover{

background:rgba(255,255,255,0.1);

}



/* ================= HERO ================= */

.hero{

height:100vh;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

text-align:center;

position:relative;

}



.hero video{

position:absolute;

inset:0;

width:100%;
height:100%;

object-fit:cover;

z-index:-1;

opacity:.5;

}



.hero h1{

font-size:70px;

font-family:'Instrument Serif',serif;

font-style:italic;

}



.hero p{

margin-top:20px;

color:#aaa;

}



/* ================= BUTTON ================= */

.btn{

padding:10px 20px;

border-radius:999px;

border:1px solid rgba(255,255,255,0.2);

margin-top:20px;

display:inline-block;

}



/* ================= SECTION ================= */

.section{

padding:120px 20px;

text-align:center;

}



/* ================= CARD ================= */

.card{

max-width:900px;

margin:40px auto;

padding:40px;

border-radius:20px;

background:rgba(255,255,255,0.03);

transition:.4s;

}



.card:hover{

transform:translateY(-6px);

box-shadow:
0 20px 60px rgba(0,0,0,0.6);

}



</style>

</head>
<body>



<!-- scroll bar -->
<div id="scrollBar"></div>


<!-- glow -->
<div id="cursorGlow"></div>


<!-- particles -->
<canvas id="bgParticles"></canvas>



<!-- NAV -->

<div class="nav">

<div class="nav-inner liquid-glass">

<a href="#">Home</a>
<a href="#">Services</a>
<a href="#">Work</a>
<a href="#">Contact</a>

</div>

</div>



<!-- HERO -->

<section class="hero">

<video autoplay loop muted playsinline
src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260307_083826_e938b29f-a43a-41ec-a153-3d4730578ab8.mp4">
</video>


<h1>The Website<br>Your Brand Deserves</h1>

<p>
AI powered design studio
</p>

<div class="btn liquid-glass">
Get Started
</div>

</section>




<!-- SERVICES -->

<section class="section">

<h2>How it works</h2>

<div class="card">

You dream it<br>
We build it<br>
AI ships it

</div>

</section>
<script>


/* ===========================
SCROLL BAR
=========================== */

window.addEventListener("scroll", () => {

const scrollTop = window.scrollY;

const height =
document.body.scrollHeight -
window.innerHeight;

const percent =
scrollTop / height * 100;

document.getElementById("scrollBar").style.width =
percent + "%";

});



/* ===========================
CURSOR GLOW
=========================== */

const glow =
document.getElementById("cursorGlow");

window.addEventListener("mousemove", e => {

glow.style.left =
e.clientX + "px";

glow.style.top =
e.clientY + "px";

});



/* ===========================
PARTICLES
=========================== */

const canvas =
document.getElementById("bgParticles");

const ctx =
canvas.getContext("2d");


function resize(){

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

resize();

window.addEventListener("resize", resize);


let particles = [];


for(let i=0;i<80;i++){

particles.push({

x:Math.random()*canvas.width,

y:Math.random()*canvas.height,

r:Math.random()*2,

v:Math.random()*0.3 + 0.1

});

}



function draw(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

ctx.fillStyle =
"rgba(255,255,255,0.3)";


particles.forEach(p=>{

ctx.beginPath();

ctx.arc(
p.x,
p.y,
p.r,
0,
Math.PI*2
);

ctx.fill();

p.y += p.v;

if(p.y > canvas.height){

p.y = 0;

p.x =
Math.random()*canvas.width;

}

});


requestAnimationFrame(draw);

}


draw();



/* ===========================
FADE IN
=========================== */

const observer =
new IntersectionObserver(entries => {

entries.forEach(entry => {

if(entry.isIntersecting){

entry.target.classList.add("show");

}

});

});


document
.querySelectorAll(".card")
.forEach(el=>observer.observe(el));



/* ===========================
HLS SUPPORT
=========================== */

function initHls(video, src){

if(src.includes(".m3u8")){

if(Hls.isSupported()){

const hls = new Hls();

hls.loadSource(src);

hls.attachMedia(video);

}

}else{

video.src = src;

}

}



/* ===========================
SMOOTH BUTTON HOVER
=========================== */

document
.querySelectorAll(".btn")
.forEach(btn=>{

btn.addEventListener("mouseenter",()=>{

btn.style.transform="scale(1.05)";

});

btn.addEventListener("mouseleave",()=>{

btn.style.transform="scale(1)";

});

});



/* ===========================
PARALLAX HERO
=========================== */

window.addEventListener(
"scroll",
()=>{

const y =
window.scrollY * 0.3;

document
.querySelector(".hero video")
.style.transform =
"translateY(" + y + "px)";

}
);



</script>


</body>
</html>
