<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多语言成人搜索助手 Pro</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1f1f1f; color: #eee; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #2d2d2d; padding: 30px; border-radius: 15px; box-shadow: 0 0 20px rgba(255,77,148,0.3); }
        h1 { text-align: center; color: #ff4d94; margin-bottom: 25px; }
        label { display: block; margin: 15px 0 6px; font-weight: bold; color: #ff99cc; }
        select, input, button { padding: 12px; margin: 6px 0; width: 100%; border-radius: 8px; font-size: 16px; }
        button { background: #ff4d94; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #ff1a7a; }
        .result { margin-top: 20px; padding: 18px; background: #333; border-radius: 10px; }
        .category-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
        .note { font-size: 14px; color: #aaa; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 多语言成人搜索助手 Pro</h1>
        
        <label>1. 选择语言：</label>
        <select id="language">
            <option value="lang:zh">中文 (Chinese)</option>
            <option value="lang:ja">日语 (Japanese - JAV)</option>
            <option value="lang:en">英语 (English)</option>
            <option value="lang:ko">韩语 (Korean)</option>
            <option value="lang:es" selected>西班牙语 (Spanish)</option>
            <option value="lang:fr">法语 (French)</option>
            <option value="lang:ru">俄语 (Russian)</option>
            <option value="lang:de">德语 (German)</option>
        </select>

        <label>2. 内容过滤器：</label>
        <select id="filter">
            <option value="filter:videos">仅视频</option>
            <option value="filter:images">仅图片</option>
            <option value="filter:media">视频+图片</option>
        </select>

        <label>3. 选择类别（可多选，按 Ctrl/Command 多选）：</label>
        <select id="category" multiple size="12" style="height: 280px;">
            <option value="自慰 OR masturbation OR 手淫">自慰</option>
            <option value="巨乳 OR big tits OR tetas grandes OR 爆乳">巨乳</option>
            <option value="中出 OR creampie OR corrida interna OR 内射">中出</option>
            <option value="学生妹 OR colegiala OR JK OR schoolgirl OR 制服">学生妹 / 校服</option>
            <option value="护士 OR enfermera OR nurse">护士</option>
            <option value="口交 OR blowjob OR mamada OR フェラ">口交</option>
            <option value="无码 OR uncensored OR sin censura OR 無修正">无码</option>
            <option value="按摩 OR masaje erótico OR happy ending">色情按摩</option>
            <option value="肛交 OR anal OR sodomía">肛交</option>
            <option value="颜射 OR facial OR corrida en la cara">颜射</option>
            <option value="多P OR threesome OR gangbang OR trío OR 乱交">多人 / 群P</option>
            <option value="amateur OR casero OR homemade OR 素人 OR 自拍">业余 / 自拍</option>
            <option value="POV">第一人称 POV</option>
            <option value="squirt OR 潮吹 OR eyaculación femenina">潮吹</option>
            <option value="lesbiana OR lesbian OR 女同">女同</option>
            <option value="MILF OR madura OR cougar OR 熟女">熟女 / MILF</option>
            <option value="OL OR office lady OR 女白领">OL / 女白领</option>
            <option value="足控 OR foot fetish OR pies">足控</option>
            <option value="BDSM OR 调教 OR SM">BDSM / 调教</option>
            <option value="公众 OR public OR 露出">公众露出</option>
            <option value="孕妇 OR pregnant">孕妇</option>
            <option value="黑丝 OR pantyhose OR 丝袜">黑丝 / 丝袜</option>
            <option value="cosplay OR 角色扮演">Cosplay</option>
        </select>

        <label>4. 自定义关键词（可选，可多个用空格隔开）：</label>
        <input type="text" id="custom" placeholder="例如：台湾 OR mexican OR onlyfans">

        <button onclick="generateSearch()">🚀 生成搜索链接</button>

        <div class="result" id="result"></div>

        <div class="note">
            <strong>使用提示：</strong><br>
            • 按住 Ctrl（Windows）或 Command（Mac）可多选类别<br>
            • 西班牙语内容特别丰富，推荐选择 lang:es + 西班牙语类别<br>
            • 生成后可直接点击跳转或复制链接
        </div>
    </div>

    <script>
        function generateSearch() {
            const lang = document.getElementById('language').value;
            const filterType = document.getElementById('filter').value;
            
            // 获取选中的类别
            const select = document.getElementById('category');
            let keywords = Array.from(select.selectedOptions).map(option => option.value);
            
            // 添加自定义关键词
            const custom = document.getElementById('custom').value.trim();
            if (custom) {
                keywords.push(custom);
            }

            if (keywords.length === 0) {
                alert("请至少选择一个类别或输入自定义关键词！");
                return;
            }

            const queryText = keywords.join(" OR ");
            const fullQuery = `${queryText} ${filterType} ${lang}`;

            const url = `https://x.com/explore/search?q=${encodeURIComponent(fullQuery)}`;

            document.getElementById('result').innerHTML = `
                <strong>生成的搜索词：</strong><br>
                <code style="background:#222; padding:8px; border-radius:6px; display:block; margin:10px 0;">${fullQuery}</code><br>
                <strong>搜索链接：</strong><br>
                <a href="${url}" target="_blank" style="color:#ff4d94; word-break:break-all;">${url}</a><br><br>
                <button onclick="window.open('${url}', '_blank')" style="width:auto; padding:10px 20px;">立即跳转到 X 搜索</button>
                <button onclick="copyToClipboard('${fullQuery}')" style="width:auto; padding:10px 20px; margin-left:10px; background:#555;">复制搜索词</button>
            `;
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert("搜索词已复制到剪贴板！");
            });
        }
    </script>
</body>
</html>
